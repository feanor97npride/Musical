<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerador de lyric video</title>
  <style>
    :root { --bg: #f7f5f2; --fg: #1d1b19; --muted: #6b6560; --accent: #8c5a2b; --card: #ffffff; --line: #d9d3cc; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #161412; --fg: #f1ece6; --muted: #a39b94; --accent: #e0b872; --card: #201d1a; --line: #3a342f; }
    }
    :root[data-theme="dark"] { --bg: #161412; --fg: #f1ece6; --muted: #a39b94; --accent: #e0b872; --card: #201d1a; --line: #3a342f; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.5rem; margin: 8px 0 4px; }
    p.lead { color: var(--muted); margin-top: 0; }
    form, .result { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    label { display: block; font-weight: 600; margin: 14px 0 6px; }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%; box-sizing: border-box; padding: 10px; font: inherit; color: var(--fg);
      background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    }
    textarea { min-height: 160px; resize: vertical; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; margin-top: 18px; }
    .warning { background: #fff4e5; color: #6b3d00; border-radius: 8px; padding: 10px; font-size: 0.95rem; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .warning { background: #3a2a14; color: #f5d9a8; }
    }
    button { margin-top: 18px; width: 100%; padding: 12px; font: inherit; font-weight: 600; border: 0;
      border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: wait; }
    .result { margin-top: 16px; display: none; }
    .result.visible { display: block; }
    .stage { font-weight: 600; }
    .detail { color: var(--muted); font-size: 0.95rem; min-height: 1.2em; }
    .error { color: #b3261e; font-weight: 600; }
    video { width: 100%; border-radius: 8px; margin-top: 12px; background: #000; }
    a.download { display: inline-block; margin-top: 12px; color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
<main>
  <h1>Gerador de lyric video</h1>
  <p class="lead">Envie um MP3 e a letra. Você recebe um vídeo vertical com legendas no tempo da música.</p>

  <form id="form">
    <div class="warning">Envie apenas músicas próprias ou com autorização.</div>

    <label for="audio">Arquivo MP3 (até 25 MB)</label>
    <input type="file" id="audio" name="audio" accept=".mp3,audio/mpeg" required>

    <label for="lyrics">Letra</label>
    <textarea id="lyrics" name="lyrics" placeholder="Cole a letra aqui. Use [Refrão] etc. para marcar seções." required></textarea>

    <label for="style">Estilo da legenda</label>
    <select id="style" name="style">
      <option value="karaoke">Karaokê (palavras acendendo)</option>
      <option value="highlight">Destaque (linha inteira, palavra atual)</option>
      <option value="oneword">Uma palavra por vez</option>
    </select>

    <label>Trecho (opcional, em segundos)</label>
    <div class="row">
      <div><input type="number" id="clip_start" name="clip_start" min="0" step="0.1" placeholder="início, ex.: 30"></div>
      <div><input type="number" id="clip_end" name="clip_end" min="0" step="0.1" placeholder="fim, ex.: 75"></div>
    </div>

    <label class="check">
      <input type="checkbox" id="confirm" name="confirm" required>
      <span>Esta música é minha ou tenho autorização para usá-la.</span>
    </label>

    <button type="submit" id="submit">Gerar vídeo</button>
  </form>

  <section class="result" id="result" aria-live="polite">
    <div class="stage" id="stage"></div>
    <div class="detail" id="detail"></div>
    <div id="output"></div>
  </section>
</main>

<script>
  const form = document.getElementById("form");
  const submit = document.getElementById("submit");
  const result = document.getElementById("result");
  const stage = document.getElementById("stage");
  const detail = document.getElementById("detail");
  const output = document.getElementById("output");
  let timer = null;

  function show(message, isError) {
    result.classList.add("visible");
    stage.textContent = message;
    stage.className = isError ? "stage error" : "stage";
  }

  function finish() {
    clearInterval(timer);
    submit.disabled = false;
  }

  async function poll(id) {
    try {
      const response = await fetch(`/jobs/${id}`);
      const job = await response.json();
      if (job.status === "error") {
        finish();
        show("Falhou: " + job.stage, true);
        detail.textContent = job.message;
      } else if (job.status === "done") {
        finish();
        show("Vídeo pronto");
        detail.textContent = "";
        output.innerHTML = "";
        const video = document.createElement("video");
        video.controls = true;
        video.src = `/jobs/${id}/video`;
        const link = document.createElement("a");
        link.className = "download";
        link.href = `/jobs/${id}/video`;
        link.download = "lyric-video.mp4";
        link.textContent = "Baixar MP4";
        output.append(video, link);
      } else {
        show(job.stage + "...");
        detail.textContent = job.message;
      }
    } catch (error) {
      finish();
      show("Não consegui falar com o servidor", true);
    }
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    submit.disabled = true;
    output.innerHTML = "";
    show("Enviando...");
    detail.textContent = "";
    let response, body;
    try {
      response = await fetch("/jobs", { method: "POST", body: new FormData(form) });
      body = await response.json().catch(() => ({}));
    } catch (error) {
      finish();
      show("Não consegui enviar. Verifique a conexão e tente de novo.", true);
      return;
    }
    if (!response.ok) {
      finish();
      show(body.detail || "Não foi possível enviar", true);
      return;
    }
    clearInterval(timer);
    timer = setInterval(() => poll(body.id), 2000);
    poll(body.id);
  });
</script>
</body>
</html>
